[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikish"
version = "0.1.0"
description = "A CLI tool to search and read Wikipedia with AI-powered summaries"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "markdownify",
    "rich",
    "nlpia2-wikipedia",
    "python-dotenv",
    "replicate",
    "requests",
    "mdv",
    "typer",
    "aiohttp",
]

[project.scripts]
wikish = "wikish.cli:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
